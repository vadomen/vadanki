<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vadanki</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main>
      <div class="auth-card">
        <span class="auth-logo">Vadanki</span>
        <p class="tagline">Spaced-repetition flashcards, AI-powered</p>

        <div class="tabs">
          <button class="tab-btn active" data-tab="login">Log in</button>
          <button class="tab-btn" data-tab="register">Register</button>
        </div>

        <p id="auth-error" class="error-msg" hidden></p>

        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input
              id="login-email"
              class="input"
              type="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              class="input"
              type="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary btn-full">Log in</button>
        </form>

        <form id="register-form" class="auth-form" hidden>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input
              id="reg-email"
              class="input"
              type="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input
              id="reg-password"
              class="input"
              type="password"
              name="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <span class="hint">At least 8 characters</span>
          </div>
          <div id="turnstile-widget" class="turnstile-widget"></div>
          <button type="submit" class="btn btn-primary btn-full">Create account</button>
        </form>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
